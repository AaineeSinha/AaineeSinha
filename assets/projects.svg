<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:#333333; stroke-width:1; }
    .title { fill:#000000; font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:#333333; font-size:12px; }
    .meta { fill:#555555; font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}
  </style>

  <g class="mono">
    <g class="row r1" transform="translate(0, 20)">
      <text class="title" x="48" y="24">01 / THREATINTEL AGENT</text>
      <text class="copy" x="48" y="49">AI-powered cyber threat intelligence platform using VirusTotal API and Google Gemini.</text>
      <text class="copy" x="48" y="68">Integrates the MITRE ATT&amp;CK framework for automated threat analysis and mitigation recommendations.</text>
      <text class="meta" x="48" y="90">PYTHON · STREAMLIT · GOOGLE GEMINI · CYBER THREAT INTELLIGENCE · VIRUSTOTAL API </text>
      <line class="rule" x1="48" y1="110" x2="952" y2="110"/>
    </g>
    
    <g class="row r2" transform="translate(0, 130)">
      <text class="title" x="48" y="24">02 / INTELLIDOCS</text>
      <text class="copy" x="48" y="49">RAG-based document intelligence platform for efficient knowledge retrieval.</text>
      <text class="copy" x="48" y="68">Enables semantic PDF querying through vector embeddings for context-aware information.</text>
      <text class="meta" x="48" y="90">LANGCHAIN · CHROMADB · GOOGLE GEMINI · RAG</text>
      <line class="rule" x1="48" y1="110" x2="952" y2="110"/>
    </g>
    
    <g class="row r3" transform="translate(0, 240)">
      <text class="title" x="48" y="24">03 / X-DEBUG</text>
      <text class="copy" x="48" y="49">AI-based debugging assistant that simplifies programming errors for beginners.</text>
      <text class="copy" x="48" y="68">Suggests contextual code improvements and explanations using advanced LLMs.</text>
      <text class="meta" x="48" y="90">PYTHON · LLM · DEBUGGING · AI-ASSISTANT</text>
      <line class="rule" x1="48" y1="110" x2="952" y2="110"/>
    </g>
  </g>
</svg>
